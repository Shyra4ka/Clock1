      - name: Download Forge MDK
        run: |
          curl -fsSL -o /tmp/mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-mdk.zip"
          mkdir -p /tmp/mdk
          unzip -q /tmp/mdk.zip -d /tmp/mdk
          MDK_DIR=$(dirname "$(find /tmp/mdk -name gradlew | head -1)")
          echo "MDK_DIR=$MDK_DIR" >> "$GITHUB_ENV"
          ls "$MDK_DIR"

      - name: Insert mod sources into MDK
        run: |
          rm -rf "$MDK_DIR/src"
          cp -r modsrc/src "$MDK_DIR/src"
          sed -i "s/^mod_id=.*/mod_id=${MOD_ID}/" "$MDK_DIR/gradle.properties"
          sed -i "s/^mod_name=.*/mod_name=Time Stop Clock/" "$MDK_DIR/gradle.properties"
          sed -i "s/^mod_group_id=.*/mod_group_id=com.example.timestopclock/" "$MDK_DIR/gradle.properties"
          sed -i "s/^mod_version=.*/mod_version=1.0.0/" "$MDK_DIR/gradle.properties"
          chmod +x "$MDK_DIR/gradlew"

      - name: Build
        working-directory: ${{ env.MDK_DIR }}
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: timestopclock-jar
          path: ${{ env.MDK_DIR }}/build/libs/*.jar
